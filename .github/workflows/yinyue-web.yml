name: Yinyue Web checks
on:
  push:
    paths: ['yinyue_web/**', '.github/workflows/yinyue-web.yml']
  pull_request:
    paths: ['yinyue_web/**', '.github/workflows/yinyue-web.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: yinyue_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: yinyue_web/backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q backend scripts run.py install_dependencies.py
      - run: node --check frontend/js/app.js
      - run: node --check frontend/js/media.js
