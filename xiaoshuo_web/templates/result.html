{% extends "base.html" %}
{% block title %}分析结果 - 小说分析系统{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
    <div><p class="text-muted small mb-1">小说分析报告</p><h1 class="h2 text-break">{{ result.get('novel_info', {}).get('title', '未命名文档') }}</h1></div>
    <div class="d-flex gap-2 flex-wrap no-print">
        <a href="{{ url_for('index') }}" class="btn btn-outline-primary">开始新分析</a>
        <button class="btn btn-outline-success" onclick="window.print()">打印 / 保存 PDF</button>
        {% if result.get('result_id') %}<a class="btn btn-outline-secondary" href="{{ url_for('export_result', result_id=result.result_id, format='html') }}">导出 HTML</a><a class="btn btn-outline-secondary" href="{{ url_for('export_result', result_id=result.result_id, format='json') }}">导出 JSON</a>{% endif %}
    </div>
</div>
{% include '_report_content.html' %}
{% endblock %}
