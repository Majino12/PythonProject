<h1>前发分层与网格检查</h1><span class="badge">派生候选 · 尚待美术确认</span>
<p>以当前真实画稿绘制表情，再组合隐区补画和独立前发。发根、眼睛与眉毛保护区保持固定；前发只在已补画范围内小幅运动。这里的技术检查不等于美术验收。</p>
<nav><a href="./short-hair-studio.html">角色工作台</a> · <a href="./short-hair-mesh-diagnostics.html">合成纹理 GPU 检查</a></nav>
<div class="controls"><label>方向<select id="pose" disabled></select></label><label>表情<select id="expression" disabled><option value="neutral">自然</option><option value="blink">闭眼、抬眉、张嘴</option><option value="asymmetric">单眼闭合、压眉、视线</option></select></label><label>查看<select id="view" disabled><option value="composite">完整合成</option><option value="source">当前表情原画</option><option value="base">隐区底图</option><option value="foreground">独立前发与接触阴影</option><option value="mesh">网格与保护区</option></select></label><label>横向 <output id="x-value">0.00</output><input id="x" type="range" min="-1" max="1" value="0" step="0.01" disabled></label><label>纵向 <output id="y-value">0.00</output><input id="y" type="range" min="-1" max="1" value="0" step="0.01" disabled></label><button id="reset" disabled>归零</button><button id="run" disabled>运行真实素材检查</button><button id="download" disabled>保存检查报告</button></div>
<div class="controls"><label><span><input id="native-pixels" type="checkbox"> 原始像素大小</span></label><button id="save-view" disabled>保存当前视图 PNG</button><span>导出保留 1122 × 1402 像素与透明背景；网格查看会保留辅助线。</span></div>
<p id="status" role="status">正在载入真实画稿、透明遮罩和前发分层…</p><p id="view-note"></p>
<div class="stage"><div class="checker"><canvas id="preview" width="1122" height="1402" aria-label="当前方向前发网格预览"></canvas></div><div><h2>检查报告</h2><p>报告记录实际文件 SHA-256、零位像素、非零路径重建、动态表情、保护区、透明边缘与运行耗时。</p><pre id="report">{"status":"loading"}</pre></div></div>
