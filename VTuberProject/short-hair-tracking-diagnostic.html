<h1>后台跟踪诊断</h1>
<p>点击后下载识别模型，在后台线程处理项目内画稿：先预热一次，再连续测量三次。不会打开摄像头或麦克风，也不会记录媒体。</p>
<p>画稿可能没有可检测人脸；本页只验证加载、后台推理和资源释放，不评价真人跟踪精度。</p>
<button id="runWorkerDiagnostic">运行一次后台诊断</button>
<pre id="workerDiagnosticStatus" role="status">尚未加载模型。</pre>
