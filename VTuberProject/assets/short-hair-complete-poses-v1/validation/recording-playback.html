<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>角色录像回放验证</title><body style="font-family:system-ui;background:#17232b;color:#eef4f5;padding:24px"><h1>角色录像回放验证</h1><video id="recording" controls muted style="max-width:100%" src="./studio-demo-recording.webm"></video><p id="metadata">正在读取录像…</p><script>const v=document.querySelector('video'); const p=document.querySelector('#metadata'); v.addEventListener('loadeddata',()=>{p.textContent=JSON.stringify({readyState:v.readyState,width:v.videoWidth,height:v.videoHeight,duration:Number.isFinite(v.duration)?v.duration:'stream',hasFrame:true})});v.addEventListener('error',()=>{p.textContent='播放失败 '+v.error?.code});</script></body></html>
