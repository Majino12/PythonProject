<!doctype html><html lang="zh"><meta charset="utf-8"><title>五官对齐检查</title><style>body{font:16px system-ui;background:#e1e5ea;color:#142638;margin:24px}canvas{max-width:48%;height:auto;border:1px solid #94a5b4}button,select,input{font:inherit;margin:6px;padding:8px}pre{white-space:pre-wrap}label{display:inline-block}</style><h1>转头五官对齐对照</h1><p>左侧原RIFE，右侧五官对齐。检查相同实际画稿、相同角度。</p><button id="load">载入画稿</button><label>左右<input id="yaw" type="number" step="0.05" min="-1" max="1" value="0.4"></label><label>上下<input id="pitch" type="number" step="0.05" min="-1" max="1" value="0.25"></label><label>眼睛<select id="eye"><option>closed</option><option>open</option><option>quarter</option><option>half</option><option>threeQuarter</option></select></label><button id="draw">绘制对照</button><button id="save">保存对照PNG</button><p id="status">等待载入</p><canvas id="before"></canvas><canvas id="after"></canvas><pre id="report"></pre><script type="module" src="./short-hair-feature-review.js"></script></html>
