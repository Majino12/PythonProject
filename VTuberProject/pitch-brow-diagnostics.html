    <p>每个姿态用同一范围展示中性、眉头抬起、眉尾抬起、压眉，以及左右独立组合。左右以角色自身为准。局部画稿保持原生尺寸，眉形和动作幅度仍需看图判断。</p>
    <p>检查已确认嘴型与视线的全部 315 组组合；再检查 336 组眉毛组合，覆盖全部 16 种双眉搭配和七种嘴型、五种眼睑状态。RGBA 像素应严格留在眉毛登记区域，并保护眼睑、嘴、鼻和已登记刘海区域。通过这些检查不代表视觉验收通过。</p>
