<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoeMotion · 连续转头验收</title>
<style>
body{max-width:1100px;margin:28px auto;padding:0 20px;background:#edf1f5;color:#253a49;font:15px/1.65 system-ui,sans-serif}
button{padding:9px 18px;margin:0 10px 12px 0;border:1px solid #8da2b1;border-radius:8px;background:white;color:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}
canvas{display:block;max-width:100%;height:auto;border:1px solid #9ba7b3;background-color:#fff;background-image:linear-gradient(45deg,#d4dde5 25%,transparent 25%),linear-gradient(-45deg,#d4dde5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d4dde5 75%),linear-gradient(-45deg,transparent 75%,#d4dde5 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:18px;background:#fff;border-radius:10px;font-size:12px}
</style>
<h1>连续转头与透明输出验收</h1>
<p>读取本地角色、透明遮罩与已生成的运动场，验证原稿端点、接缝、动态眼口和输出 alpha。点击后运行，不开启摄像头。</p>
<button id="run" type="button">运行验收</button><button id="download" type="button" disabled>下载 JSON 报告</button>
<p id="status" role="status">等待运行。</p>
<canvas id="preview" width="780" height="600" aria-label="连续转头透明验收画面"></canvas>
<pre id="report">{"status":"idle"}</pre>
<script type="module" src="./short-hair-continuous-diagnostics.js"></script>
</html>
